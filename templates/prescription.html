{% extends 'doctorsubheader.html' %}
{% block content %}
<style>
    body {
        font-family: 'Segoe UI', sans-serif;
        background: linear-gradient(to right, #e3f2fd, #fce4ec);
        margin: 0;
        padding: 0;
    }

    .form-wrapper {
        max-width: 600px;
        margin: 4rem auto;
        background: #ffffff;
        padding: 2rem 2.5rem;
        border-radius: 16px;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
    }

    h2 {
        text-align: center;
        color: #007bff;
        margin-bottom: 1.5rem;
        font-weight: bold;
    }

    form {
        display: flex;
        flex-direction: column;
        gap: 1rem;
    }

    input, select, textarea {
        width: 100%;
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 8px;
        font-size: 1rem;
    }

    button {
        padding: 12px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 1rem;
        cursor: pointer;
        transition: background-color 0.3s ease;
    }

    button:hover {
        background-color: #0056b3;
    }

    @media (max-width: 600px) {
        .form-wrapper {
            margin: 2rem 1rem;
            padding: 1.5rem;
        }
    }
</style>

<div class="form-wrapper">
    <h2></h2>
    <form method="post">
        {% csrf_token %}
        {{ form1.as_p }}
        <button type="submit">Submit</button>
    </form>
</div>
{% endblock %}
