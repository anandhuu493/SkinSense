{% extends 'adminheader.html' %}
{% block content %}
<style>
    body {
        font-family: 'Segoe UI', sans-serif;
        background: #f4f6f9;
        margin: 0;
        padding: 0;
    }

    .form-card {
        max-width: 700px;
        margin: 60px auto;
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
        padding: 30px 40px;
    }

    h2 {
        text-align: center;
        color: #343a40;
        margin-bottom: 25px;
        font-weight: 600;
    }

    form {
        display: flex;
        flex-direction: column;
        gap: 1rem;
    }

    input, select, textarea {
        width: 100%;
        padding: 12px;
        border: 1px solid #ced4da;
        border-radius: 8px;
        font-size: 15px;
        background: #fefefe;
    }

    button {
        width: 100%;
        padding: 12px;
        background-color: #007bff;
        color: white;
        font-size: 16px;
        font-weight: 600;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: background 0.3s ease;
    }

    button:hover {
        background-color: #0056b3;
    }

    @media (max-width: 768px) {
        .form-card {
            margin: 30px 20px;
            padding: 25px;
        }
    }
</style>

<div class="col-md-12">
    <div class="form-card">
        <h2></h2>
        <form action="" method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form1.as_p }}
            <button type="submit">Submit</button>
        </form>
    </div>
</div>
{% endblock %}
