<!DOCTYPE html>
<html>
<head>
    <title>Doctor_List</title>
</head>
<body>
    <h1>Doctor_list</h1>
    <table border="1">
        <tr>
            <th>name</th>
            <th>gender</th>
            <th>dob</th>
            <th>qualification</th>
            <th>experience</th>
            <th>contact</th>
            

            <th colspan="2">option</th>

        </tr>
        {% for std in doct %}
        <tr>
            <td>{{ std.name }}</td>
            <td>{{ std.gender }}</td>
            <td>{{ std.dob }}</td>
            <td>{{ std.qualification}}</td>
            <td>{{ std.experience}}</td>
            <td>{{ std.contact }}</td>
        


        </tr>

        {% endfor %}
    </table>
</body>
</html>
