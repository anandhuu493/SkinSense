{% extends 'adminheader.html' %}
{% block content %}
<style>
    body {
        font-family: 'Segoe UI', sans-serif;
        background-color: #f4f6f9;
        padding: 30px;
    }

    h2 {
        text-align: center;
        color: #007bff;
        font-weight: 600;
        margin-bottom: 30px;
    }

    form {
        max-width: 600px;
        margin: auto;
        background: #ffffff;
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.08);
    }

    label {
        display: block;
        margin-bottom: 8px;
        color: #333;
        font-weight: 500;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"],
    input[type="date"],
    textarea,
    select {
        width: 100%;
        padding: 12px;
        margin-bottom: 20px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 15px;
    }

    button[type="submit"] {
        display: block;
        width: 100%;
        background-color: #007bff;
        color: white;
        border: none;
        padding: 12px;
        font-size: 16px;
        border-radius: 6px;
        cursor: pointer;
        transition: background-color 0.3s ease-in-out;
    }

    button[type="submit"]:hover {
        background-color: #0056b3;
    }
</style>

<!-- <h2>Admin Form</h2> -->
<form action="" method="post">
    {% csrf_token %}
    {{ form1.as_p }}
    <button type="submit">Submit</button>
</form>
{% endblock %}
