{% extends 'adminheader.html' %}
{% block content %}
<style>
    body {
        font-family: 'Segoe UI', sans-serif;
        background-color: #f0f2f5;
        margin: 0;
        padding: 20px;
    }

    .form-wrapper {
        max-width: 600px;
        margin: 50px auto;
        background: #ffffff;
        border-radius: 12px;
        padding: 30px 40px;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
    }

    h2 {
        text-align: center;
        color: #007bff;
        margin-bottom: 25px;
        font-weight: 600;
        font-size: 1.8rem;
    }

    form {
        display: flex;
        flex-direction: column;
        gap: 1.2rem;
    }

    input, select, textarea {
        width: 100%;
        padding: 12px;
        border-radius: 8px;
        border: 1px solid #ccc;
        font-size: 15px;
        background-color: #fefefe;
    }

    button[type="submit"] {
        padding: 12px;
        font-size: 16px;
        font-weight: 600;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: background-color 0.3s ease;
    }

    button[type="submit"]:hover {
        background-color: #0056b3;
    }

    @media (max-width: 600px) {
        .form-wrapper {
            padding: 20px;
            margin: 30px 15px;
        }
    }
</style>

<div class="form-wrapper">
    <h2></h2>
    <form action="" method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form1.as_p }}
        <button type="submit">Submit</button>
    </form>
</div>
{% endblock %}
