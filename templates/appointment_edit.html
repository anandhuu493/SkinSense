{% extends 'usersubheader.html' %}
{% block content %}
<style>
    body {
        font-family: 'Segoe UI', sans-serif;
        background: linear-gradient(to right, #e3f2fd, #fce4ec);
        margin: 0;
        padding: 0;
    }

    .form-container {
        max-width: 600px;
        margin: 3rem auto;
        background-color: #ffffff;
        padding: 2rem;
        border-radius: 16px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
    }

    h2 {
        text-align: center;
        font-weight: bold;
        color: #007bff;
        margin-bottom: 1.5rem;
    }

    form {
        display: flex;
        flex-direction: column;
        gap: 1rem;
    }

    input, select, textarea {
        width: 100%;
        padding: 0.75rem;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 1rem;
    }

    button {
        padding: 0.75rem;
        background-color: #28a745;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 1rem;
        cursor: pointer;
        transition: background-color 0.3s ease;
    }

    button:hover {
        background-color: #218838;
    }
</style>

<div class="form-container">
    <h2>Edit Appointment</h2>
    <form method="post">
        {% csrf_token %}
        {{ form1.as_p }}
        <button type="submit">Update</button>
    </form>
</div>
{% endblock %}
