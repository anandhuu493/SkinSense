{% extends 'landingsubheader.html' %}
{% block content %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    
    <!-- ✅ Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f8f9fa;
        }
        .form-container {
            max-width: 600px;
            margin: 50px auto;
            padding: 25px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.1);
        }
        h2 {
            text-align: center;
            margin-bottom: 25px;
            font-weight: bold;
            color: #0d6efd;
        }
        .form-control {
            border-radius: 8px;
            margin-bottom: 15px;
        }
        .btn-custom {
            width: 100%;
            border-radius: 8px;
            padding: 12px;
            font-size: 16px;
            background: #0d6efd;
            color: white;
            font-weight: 600;
        }
        .btn-custom:hover {
            background: #0b5ed7;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Registration Form</h2>
        <form action="" method="post">
            {% csrf_token %}

            <!-- ✅ Django form with Bootstrap classes -->
            {{ form.as_p }}
            {{ forms.as_p }}

            <button type="submit" class="btn btn-custom">Submit</button>
        </form>
    </div>

    <!-- ✅ Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

{% endblock %}
