{% extends 'doctorsubheader.html' %}
{% block content %}

<style>
    body {
        font-family: 'Segoe UI', sans-serif;
        background-color: #f0f8ff;
        margin: 0;
        padding: 0;
    }
      .form-control {
            width: 100%;
            padding: 10px 12px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 8px;
            transition: 0.3s;
        }

    .form-card {
        max-width: 600px;
        margin: 50px auto;
        background: #ffffff;
        padding: 40px;
        border-radius: 16px;
        box-shadow: 0 12px 24px rgba(0, 0, 0, 0.1);
    }

    h2 {
        text-align: center;
        margin-bottom: 30px;
        font-size: 24px;
        color: #2c3e50;
    }

    form p {
        margin-bottom: 20px;
    }

    input, select, textarea {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 8px;
        font-size: 14px;
        background-color: #f9f9f9;
    }

    button {
        width: 100%;
        padding: 12px;
        background-color: #007bff;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        color: white;
        cursor: pointer;
        transition: background 0.3s ease;
    }

    button:hover {
        background-color: #0056b3;
    }
</style>

<div class="form-card">
    <h2></h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        {{ forms.as_p }}
        <button type="submit">Submit</button>
    </form>
</div>

{% endblock %}
