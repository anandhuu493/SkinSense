{% extends 'doctorsubheader.html' %}
{% block content %}
<style>
    body {
        font-family: 'Segoe UI', sans-serif;
        background: #f5f7fa;
        margin: 0;
        padding: 0;
    }

    .card {
        margin: 3rem auto;
        max-width: 90%;
        background-color: #ffffff;
        border-radius: 12px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
    }

    .card-header {
        padding: 1.25rem;
        border-bottom: 1px solid #e0e0e0;
        text-align: center;
    }

    .card-header h3 {
        margin: 0;
        color: #007bff;
        font-weight: bold;
    }

    .card-body {
        padding: 1.5rem;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 1rem;
    }

    th, td {
        padding: 14px;
        text-align: center;
        border-bottom: 1px solid #eee;
    }

    th {
        background-color: #007bff;
        color: white;
        font-size: 16px;
        text-transform: capitalize;
    }

    tr:hover {
        background-color: #f9f9f9;
    }

    a.btn {
        padding: 8px 14px;
        border-radius: 6px;
        color: white;
        font-weight: bold;
        text-decoration: none;
        transition: background-color 0.3s ease;
    }

    a.btn-edit {
        background-color: #28a745;
    }

    a.btn-edit:hover {
        background-color: #218838;
    }

    a.btn-delete {
        background-color: #dc3545;
    }

    a.btn-delete:hover {
        background-color: #c82333;
    }

    @media (max-width: 768px) {
        th, td {
            font-size: 14px;
            padding: 10px;
        }

        .card {
            margin: 1.5rem;
        }
    }
</style>

<div class="col-md-12">
    <div class="card">
        <div class="card-header">
            <h3></h3>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table id="multi-filter-select" class="display table table-striped table-hover">
                    <thead>
                        <tr>
                            <th>User Name</th>
                            <th>Prescription</th>
                            <th colspan="2">Options</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for std in hosp %}
                        <tr>
                            <td>{{ std.user_id.name }}</td>
                            <td>{{ std.prescription }}</td>
                            <td><a href="{% url 'prescription_edit' std.id %}" class="btn btn-edit">Edit</a></td>
                            <td><a href="{% url 'prescription_delete' std.id %}" class="btn btn-delete">Delete</a></td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
{% endblock %}
